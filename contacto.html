<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contacto - Envía un mensaje y conectemos.">
  <title>Contacto | Portafolio Futurista</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="glow-orb glow-orb-1" id="orb-1"></div>
  <div class="glow-orb glow-orb-2" id="orb-2"></div>

  <header class="header" id="main-header">
    <a href="index.html" class="logo">FUTURO<span>//</span></a>
    <nav>
      <ul class="nav-menu">
        <li><a href="index.html"     class="nav-link"        id="link-inicio">Inicio</a></li>
        <li><a href="sobre-mi.html"  class="nav-link"        id="link-sobre-mi">Sobre mí</a></li>
        <li><a href="proyectos.html" class="nav-link"        id="link-proyectos">Proyectos</a></li>
        <li><a href="contacto.html"  class="nav-link active"  id="link-contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <div class="page-content" id="page-content">
    <div class="section-label">Contacto // Enviar Transmisión</div>
    <h1 class="section-title">INICIAR <span>CONEXIÓN</span></h1>

    <div class="contact-container" id="contact-box">
      <form class="contact-form" id="contact-form-data" action="#" method="POST"
            onsubmit="event.preventDefault(); alert('Mensaje enviado correctamente ✓'); this.reset();">
        <div class="form-group">
          <label for="form-name" class="form-label">Nombre</label>
          <input type="text" id="form-name" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="form-email" class="form-label">Correo Electrónico</label>
          <input type="email" id="form-email" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="form-message" class="form-label">Mensaje</label>
          <textarea id="form-message" class="form-input" required></textarea>
        </div>
        <button type="submit" class="cta-button form-submit-btn" id="btn-submit">
          Enviar Mensaje
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      gsap.set(".header",      { opacity: 0, y: -30 });
      gsap.set(".glow-orb",    { opacity: 0, scale: 0.6 });
      gsap.set("#contact-box", { opacity: 0, y: 50 });
      gsap.set(".section-label, .section-title", { opacity: 0, y: 20 });

      const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
      tl.to(".glow-orb",     { opacity: 0.15, scale: 1, duration: 1.8, stagger: 0.3 })
        .to(".header",       { opacity: 1, y: 0, duration: 1.0 }, "-=1.4")
        .to([".section-label", ".section-title"], { opacity: 1, y: 0, duration: 0.9, stagger: 0.15 }, "-=0.8")
        .to("#contact-box",  { opacity: 1, y: 0, duration: 1.1 }, "-=0.6");

      document.addEventListener("mousemove", (e) => {
        const xP = (e.clientX / window.innerWidth  - 0.5) * 80;
        const yP = (e.clientY / window.innerHeight - 0.5) * 80;
        gsap.to("#orb-1", { x:  xP * 1.2, y:  yP * 1.2, duration: 2.5, ease: "power2.out" });
        gsap.to("#orb-2", { x: -xP * 0.8, y: -yP * 0.8, duration: 3,   ease: "power2.out" });
      });
    });
  </script>
  <!-- Sistema de Monitoreo de Visitas Oculto -->
  <script type="module" src="js/visitor-tracker.js"></script>
  <script type="module" src="js/admin-panel.js"></script>
</body>
</html>
